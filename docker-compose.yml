name: dhira-commerce

services:
  postgres:
    image: postgres:16-alpine
    container_name: dhira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhira
      POSTGRES_PASSWORD: dhira_dev_password
      POSTGRES_DB: dhira_commerce
    ports:
      - "5432:5432"
    volumes:
      - dhira_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhira -d dhira_commerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dhira-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dhira_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dhira_pgdata:
  dhira_redisdata:
